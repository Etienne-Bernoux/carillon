<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Carillon — un bac à sable où la physique fait la musique : dessine des barres, lâche des billes, chaque rebond joue une note."
    />
    <title>Carillon — la physique fait la musique</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='11' r='6' fill='%237dd3fc'/%3E%3Crect x='4' y='22' width='24' height='4' rx='2' fill='%23f0abfc'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="overlay">
      <header class="brand" data-hud>
        <h1>Carillon</h1>
        <p class="tagline">la physique fait la musique</p>
      </header>

      <!-- Chaque bouton porte un pictogramme ET un libellé. Sous 640 px, seul le pictogramme reste
           visible (cf. style.css) : le HUD occupait 44 % d'un écran de 320×568. Le libellé accessible
           et l'infobulle sont conservés dans les deux cas — un pictogramme sans nom est une devinette.
           Exception assumée : le bouton de gamme garde un nom court, parce que son texte **porte
           l'état** (quelle gamme joue) et qu'aucune icône ne peut le dire. -->
      <nav class="toolbar" aria-label="Contrôles" data-hud>
        <button type="button" data-control="tuning" aria-label="Changer de gamme" title="Changer de gamme">
          <span class="icon" aria-hidden="true">♪</span>
          <span class="label" id="tuning-label">Pentatonique mineure</span>
          <span class="label-short" id="tuning-label-short" aria-hidden="true">Pent. min.</span>
        </button>
        <button
          type="button"
          data-control="instrument"
          aria-label="Changer d’instrument"
          title="Changer d’instrument"
        >
          <span class="icon" aria-hidden="true">◈</span>
          <span class="label" id="instrument-label">Carillon</span>
          <span class="label-short" id="instrument-label-short" aria-hidden="true">Carillon</span>
        </button>
        <button type="button" data-control="surprise" aria-label="Scène surprise" title="Scène surprise">
          <span class="icon" aria-hidden="true">✦</span>
          <span class="label">Scène surprise</span>
        </button>
        <button
          type="button"
          data-control="share"
          aria-label="Partager cette scène"
          title="Copier un lien vers cette scène"
        >
          <span class="icon" aria-hidden="true">⤴</span>
          <span class="label">Partager</span>
        </button>
        <button
          type="button"
          data-control="undo"
          aria-label="Annuler le dernier geste"
          title="Annuler le dernier geste (Cmd/Ctrl+Z)"
        >
          <span class="icon" aria-hidden="true">↺</span>
          <span class="label">Annuler</span>
        </button>
        <button type="button" data-control="clear" aria-label="Tout effacer" title="Tout effacer">
          <span class="icon" aria-hidden="true">✕</span>
          <span class="label">Effacer</span>
        </button>
        <button
          type="button"
          data-control="mute"
          aria-pressed="false"
          aria-label="Couper le son"
          title="Couper le son"
        >
          <span class="icon" aria-hidden="true">♫</span>
          <span class="label" id="mute-label">Son activé</span>
        </button>
      </nav>

      <!-- Volontairement court : cet indice est lu une fois, et chaque ligne qu'il prend est de la
           hauteur de jeu perdue sur un petit écran. L'édition se découvre par les poignées qui
           apparaissent au survol d'une barre, pas par du texte. -->
      <p class="hint" id="hint" data-hud role="status" aria-live="polite">
        <strong>Glisse</strong> pour dessiner · <strong>Clique</strong> pour lâcher une bille
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
