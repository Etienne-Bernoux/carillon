<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>carillon — fixture smoke</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" width="400" height="300"></canvas>
    <script type="module">
      // Faux window.__carillon conforme au contrat de src/main.ts, pour valider
      // scripts/shoot.mjs de bout en bout avant que l'app réelle existe.
      const canvas = document.getElementById('scene')
      const ctx = canvas.getContext('2d')

      const state = {
        bars: [],
        balls: [],
        impacts: 0,
        notes: 0,
        muted: false,
        nextBarId: 1,
        nextBallId: 1,
      }

      let fps = 60
      let lastFrameAt = performance.now()

      function draw() {
        ctx.fillStyle = '#111'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        // Point animé sur l'horloge murale (indépendant de l'API de debug) :
        // garantit que deux captures prises à des instants différents diffèrent
        // toujours, même sans interaction — c'est ce que shoot.mjs vérifie.
        const t = performance.now() / 1000
        ctx.strokeStyle = '#3af'
        ctx.lineWidth = 2
        ctx.beginPath()
        ctx.arc(200 + Math.sin(t) * 150, 150 + Math.cos(t * 1.3) * 100, 10, 0, Math.PI * 2)
        ctx.stroke()

        ctx.strokeStyle = '#8f8'
        ctx.lineWidth = 3
        for (const bar of state.bars) {
          ctx.beginPath()
          ctx.moveTo(bar.ax, bar.ay)
          ctx.lineTo(bar.bx, bar.by)
          ctx.stroke()
        }

        ctx.fillStyle = '#fa0'
        for (const ball of state.balls) {
          ctx.beginPath()
          ctx.arc(ball.x, ball.y, 6, 0, Math.PI * 2)
          ctx.fill()
        }

        const now = performance.now()
        const delta = now - lastFrameAt
        if (delta > 0) fps = 1000 / delta
        lastFrameAt = now

        requestAnimationFrame(draw)
      }
      requestAnimationFrame(draw)

      window.__carillon = {
        version: 1,
        addBar(ax, ay, bx, by) {
          const id = state.nextBarId++
          state.bars.push({ id, ax, ay, bx, by })
          return id
        },
        dropBall(x, y) {
          const id = state.nextBallId++
          state.balls.push({ id, x, y, vy: 0 })
          return id
        },
        advance(seconds) {
          const dt = 1 / 60
          let remaining = seconds
          while (remaining > 0) {
            for (const ball of state.balls) {
              ball.vy += 600 * dt
              ball.y += ball.vy * dt
              if (ball.y > canvas.height - 10) {
                ball.y = canvas.height - 10
                ball.vy *= -0.6
                state.impacts++
                state.notes++
              }
            }
            remaining -= dt
          }
        },
        reset() {
          state.bars = []
          state.balls = []
          state.impacts = 0
          state.notes = 0
        },
        setMuted(muted) {
          state.muted = muted
        },
        stats() {
          return {
            fps,
            balls: state.balls.length,
            bars: state.bars.length,
            impacts: state.impacts,
            notes: state.notes,
          }
        },
      }
    </script>
  </body>
</html>
